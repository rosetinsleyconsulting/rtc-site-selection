# Production deploy on Galahad. Reads .env from this folder for both build args and runtime.
# Exposed on loopback only; public access goes through the Cloudflare Tunnel.
name: rtc-site-selection

services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: rtc-site-selection:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5010:5000"
    environment:
      PORT: 5000
      # Galahad's native Postgres, reached from inside the container via the host gateway
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      # Read-only login that can only run the appraisal constraint check in the site_selection database
      SPATIAL_DATABASE_URL: ${DOCKER_SPATIAL_DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Tiles are fetched from Martin over the private rtc-tiles network, never the public internet
      MARTIN_URL: http://martin:3000
      APP_URL: https://app.rosetinsleyconsulting.com
    networks:
      - default
      - rtc-tiles

networks:
  rtc-tiles:
    external: true
